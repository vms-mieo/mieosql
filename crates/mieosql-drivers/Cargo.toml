[package]
name = "mieosql-drivers"
description = "MieoSQL database drivers (sqlx: MySQL/MariaDB, PostgreSQL, SQLite)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mieosql-core = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

# NoSQL / non-sqlx engines (feature pack v2 connectors)
tiberius = { version = "0.13", default-features = false, features = ["rustls", "chrono", "tds73"] }
mongodb = { version = "3.9", default-features = true }
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rskafka = { version = "0.6", default-features = false, features = ["transport-tls", "compression-gzip", "compression-lz4", "compression-snappy", "compression-zstd"] }
